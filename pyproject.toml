[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copticscriptorium-tf"
version = "0.1.0"
description = "Local Coptic Scriptorium TT to native Text-Fabric converter"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["text-fabric==13.1.0"]

[project.scripts]
copticscriptorium-tf = "copticscriptorium_tf.converter:main"

[tool.hatch.build.targets.wheel]
packages = ["copticscriptorium_tf"]
