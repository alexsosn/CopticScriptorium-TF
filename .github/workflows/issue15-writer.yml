name: issue15-writer

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: issue15-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-tf-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned real Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'
      - name: Run issue 15 writer and reload tests
        run: python -m unittest discover -s tests -p 'test_issue15_*.py' -v
