name: issue89-real-Coptic-LXX-dual-native-modules

on:
  pull_request:
    paths:
      - '.github/workflows/issue89-dual-native-modules.yml'
      - 'copticscriptorium_tf/lxx_modules.py'
      - 'copticscriptorium_tf/lxx_reference.py'
      - 'tests/test_issue89_dual_modules.py'
      - 'tests/live_issue89_dual_modules.py'
      - 'research/issue-89/**'
      - 'docs/coptic-lxx-reference-modules.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue89-dual-native-modules.yml'
      - 'copticscriptorium_tf/lxx_modules.py'
      - 'tests/test_issue89_dual_modules.py'
      - 'tests/live_issue89_dual_modules.py'
      - 'docs/coptic-lxx-reference-modules.md'

permissions:
  contents: read

jobs:
  real-parent-dual-weft:
    name: Immutable real TT and CenterBLC/LXX → two reloadable native TF modules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Coptic converter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source code head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Fetch three authentic Coptic OT TT records at immutable revision
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: real-coptic
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sahidic.ruth/sahidic.ruth_TT/Ruth_02.tt
            /sahidic.jonah/sahidic.jonah_TT/Jonah_02.tt
            /bohairic-jonah/bohairic.jonah_TT/bohairic.Jonah_02.tt
            /bohairic-habakkuk/bohairic.habakkuk_TT/bohairic.Habakkuk_02.tt

      - name: Fetch actual version-pinned Greek LXX TF data
        uses: actions/checkout@v4
        with:
          repository: CenterBLC/LXX
          ref: f32a98eddf7eb239aa73ab863d70381e416d5076
          path: real-lxx
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tf/1935

      - name: Verify both upstream commits
        run: |
          test "$(git -C real-coptic rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"
          test "$(git -C real-lxx rev-parse HEAD)" = "f32a98eddf7eb239aa73ab863d70381e416d5076"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned TF version
        run: python -m pip install 'text-fabric==13.1.0'

      - name: RED/green weft writer and adversarial source contracts
        run: |
          python -m unittest tests.test_issue89_dual_modules -v
          python -m unittest tests.test_issue70_lxx_reference_candidates -v

      - name: Build and reload two actual native Coptic and Greek TF modules
        timeout-minutes: 12
        run: /usr/bin/time -v python tests/live_issue89_dual_modules.py real-coptic real-lxx/tf/1935

      - name: Show available scratch space without uploading upstream texts
        if: always()
        run: df -h "$RUNNER_TEMP"
