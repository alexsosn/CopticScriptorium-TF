name: issue113-Coptic-NT-reference-candidates

on:
  pull_request:
    paths:
      - 'copticscriptorium_tf/nt_reference.py'
      - 'copticscriptorium_tf/nt_paired_verse.py'
      - 'tests/test_issue117_paired_verse.py'
      - 'tests/live_issue117_paired.py'
      - 'tests/test_issue117_mark1_dual_cts.py'
      - 'tests/live_issue117_mark1_cts.py'
      - 'tests/test_issue113_nt_reference.py'
      - 'tests/live_issue113_nt_reference.py'
      - 'tests/live_issue113_all_source_audit.py'
      - 'tests/test_issue113_all_source_audit.py'
      - 'copticscriptorium_tf/nt_reference_audit.py'
      - 'copticscriptorium_tf/nt_source_diagnostics.py'
      - 'tests/test_issue117_source_anomalies.py'
      - 'research/issue_117/**'
      - 'copticscriptorium_tf/nt_modules.py'
      - 'tests/test_issue113_nt_modules.py'
      - 'tests/test_issue113_nt_projection.py'
      - 'tests/live_issue113_nt_modules.py'
      - '.github/workflows/issue113-nt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue113-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nt-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'
      - name: Run source and native weft regressions
        run: |
          python -m unittest discover -s tests -p 'test_issue113_*.py' -v
          python -m unittest discover -s tests -p 'test_issue117_*.py' -v
      - name: Checkout pinned complete physical TT evidence (sparse)
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: pinned-coptic
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*_TT/**
            /*/*_TT.zip
          persist-credentials: false
      - name: Checkout independent exact pinned Greek NT parent
        uses: actions/checkout@v4
        with:
          repository: alexsosn/sblgnt
          ref: 4dd0207bda66133fdfa9740ff0aae7de61228700
          path: pinned-greek
          persist-credentials: false
      - name: Verify real Mark/1Cor Greek NT verse candidates
        run: python tests/live_issue113_nt_reference.py pinned-coptic pinned-greek
      - name: Reload real bilateral native NT verse-address wefts
        run: python tests/live_issue113_nt_modules.py pinned-coptic pinned-greek
      - name: Inspect pinned 1Cor14 source word-label pairs against Greek parent
        run: python tests/live_issue117_paired.py pinned-coptic pinned-greek
      - name: Verify dual CTS witnesses in pinned Mark1 with Greek parent reverse sections
        run: python tests/live_issue117_mark1_cts.py pinned-coptic pinned-greek
      - name: Audit all 2628 source TT records and 2747 NT SBL annotations
        run: python tests/live_issue113_all_source_audit.py pinned-coptic pinned-greek > "$RUNNER_TEMP/nt-candidate-full-census.json"
      - name: Independently verify pinned Mark1/1Cor1 original TT attribute shapes
        run: python research/issue_117/source_shape_probe.py pinned-coptic > "$RUNNER_TEMP/nt-source-anomaly-shapes.json"
      - name: Show source-free summary, keep exact ordinal inventory in artifact
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((root/"nt-candidate-full-census.json").read_text())
          anomaly=report["noncandidate_source_shapes"]
          print(json.dumps({
              "statuses":report["statuses"],
              "noncandidate_occurrences":anomaly["noncandidate_occurrences"],
              "reason_codes":anomaly["reason_codes"],
              "marker_shapes":anomaly["marker_shapes"],
              "diagnostic_physical_records":len(anomaly["by_physical_record"]),
              "noncandidate_counts_by_record":anomaly["by_physical_record"],
              "parent_verse_unavailable": [
                  {key:row[key] for key in ("source_record_id","source_ordinal","kind","reason_code")}
                  for row in anomaly["inventory"]
                  if row["reason_code"] == "parent_verse_unavailable"
              ],
              "independent_source_probe":json.loads((root/"nt-source-anomaly-shapes.json").read_text()),
          },sort_keys=True,indent=2))
          PY
      - name: Upload source-free review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nt-candidate-full-source-census
          path: |
            ${{ runner.temp }}/nt-candidate-full-census.json
            ${{ runner.temp }}/nt-source-anomaly-shapes.json
          if-no-files-found: ignore
          retention-days: 14
