name: issue113-Coptic-NT-reference-candidates

on:
  pull_request:
    paths:
      - 'copticscriptorium_tf/nt_reference.py'
      - 'tests/test_issue113_nt_reference.py'
      - 'tests/live_issue113_nt_reference.py'
      - 'tests/live_issue113_all_source_audit.py'
      - 'tests/test_issue113_all_source_audit.py'
      - 'copticscriptorium_tf/nt_reference_audit.py'
      - 'copticscriptorium_tf/nt_modules.py'
      - 'tests/test_issue113_nt_modules.py'
      - 'tests/test_issue113_nt_projection.py'
      - 'tests/live_issue113_nt_modules.py'
      - '.github/workflows/issue113-nt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue113-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nt-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed NT resolver regressions
        run: python -m unittest discover -s tests -p 'test_issue113_*.py' -v
      - name: Install pinned native Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'
      - name: Checkout pinned complete physical TT evidence (sparse)
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: pinned-coptic
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*_TT/**
            /*/*_TT.zip
          persist-credentials: false
      - name: Checkout independent exact pinned Greek NT parent
        uses: actions/checkout@v4
        with:
          repository: alexsosn/sblgnt
          ref: 4dd0207bda66133fdfa9740ff0aae7de61228700
          path: pinned-greek
          persist-credentials: false
      - name: Verify real Mark/1Cor Greek NT verse candidates
        run: python tests/live_issue113_nt_reference.py pinned-coptic pinned-greek
      - name: Reload real bilateral native NT verse-address wefts
        run: python tests/live_issue113_nt_modules.py pinned-coptic pinned-greek
      - name: Audit all 2628 source TT records and 2747 NT SBL annotations
        run: python tests/live_issue113_all_source_audit.py pinned-coptic pinned-greek > "$RUNNER_TEMP/nt-candidate-full-census.json"
      - name: Show source-free full-corpus result
        run: cat "$RUNNER_TEMP/nt-candidate-full-census.json"
      - name: Upload source-free review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nt-candidate-full-source-census
          path: ${{ runner.temp }}/nt-candidate-full-census.json
          if-no-files-found: ignore
          retention-days: 14
