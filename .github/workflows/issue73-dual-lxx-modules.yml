name: issue73-real-native-coptic-lxx-reference-modules

on:
  pull_request:
    paths:
      - '.github/workflows/issue73-dual-lxx-modules.yml'
      - 'copticscriptorium_tf/lxx_module.py'
      - 'copticscriptorium_tf/lxx_reference.py'
      - 'tests/test_issue73_lxx_dual_tf_modules.py'
      - 'tests/live_issue73_dual_modules.py'
      - 'research/issue-73/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue73-dual-lxx-modules.yml'
      - 'copticscriptorium_tf/lxx_module.py'
      - 'tests/test_issue73_lxx_dual_tf_modules.py'
      - 'tests/live_issue73_dual_modules.py'

permissions:
  contents: read

jobs:
  both-native-warp-modules:
    name: Actual pinned Coptic/LXX parent TF modules and shared reference query
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed Coptic converter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact reviewed converter head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Checkout three real Coptic OT TT source records at immutable commit
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: real-coptic
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sahidic.ruth/sahidic.ruth_TT/Ruth_02.tt
            /sahidic.jonah/sahidic.jonah_TT/Jonah_02.tt
            /bohairic-habakkuk/bohairic.habakkuk_TT/bohairic.Habakkuk_02.tt

      - name: Checkout full mapping-critical pinned CenterBLC/LXX parent TF files
        uses: actions/checkout@v4
        with:
          repository: CenterBLC/LXX
          ref: f32a98eddf7eb239aa73ab863d70381e416d5076
          path: real-lxx
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tf/1935

      - name: Verify both exact upstream commits
        run: |
          test "$(git -C real-coptic rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"
          test "$(git -C real-lxx rev-parse HEAD)" = "f32a98eddf7eb239aa73ab863d70381e416d5076"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned native Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'

      - name: Run RED-first bilateral TF module tests and source evidence tests
        run: |
          python -m unittest tests.test_issue69_native_verse_references -v
          python -m unittest tests.test_issue70_lxx_reference_candidates -v
          python -m unittest tests.test_issue73_lxx_dual_tf_modules -v

      - name: Materialize and reload both genuine pinned TF modules; join by shared reference
        timeout-minutes: 15
        run: python tests/live_issue73_dual_modules.py real-coptic real-lxx/tf/1935
