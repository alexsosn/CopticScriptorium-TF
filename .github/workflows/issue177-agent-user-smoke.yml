name: issue177-agent-installed-user-real-source-smoke

on:
  pull_request:
    paths:
      - '.github/workflows/issue177-agent-user-smoke.yml'
      - 'tests/test_issue177_agent_smoke.py'
      - 'tests/live_issue177_agent_user_smoke.py'
      - 'research/issue-177/**'
      - 'README.md'
      - 'copticscriptorium_tf/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  independent-real-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact code under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify immutable converter head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Checkout two immutable upstream Coptic TT documents only
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: real-coptic
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /thomas-gospel/thomas.gospel_TT/thomas_gospel.tt
            /pistis-sophia/pistis.sophia_TT/pistis.sophia_book_1_part1.tt

      - name: Verify pinned upstream source and one original file length
        run: |
          test "$(git -C real-coptic rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"
          test "$(stat -c%s real-coptic/thomas-gospel/thomas.gospel_TT/thomas_gospel.tt)" = "1474064"
          test -f real-coptic/pistis-sophia/pistis.sophia_TT/pistis.sophia_book_1_part1.tt

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run RED-first user journey contract
        run: python -m unittest tests.test_issue177_agent_smoke -v

      - name: Build verified package wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean/bin/copticscriptorium-tf" --help

      - name: Verify exact installed-user smoke and negative path
        timeout-minutes: 16
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" "$GITHUB_WORKSPACE/tests/live_issue177_agent_user_smoke.py" \
            "$GITHUB_WORKSPACE/real-coptic" \
            "$RUNNER_TEMP/clean/bin" \
            "$RUNNER_TEMP/researcher-smoke"

      - name: Inspect ephemeral scratch use without uploading original/derived text
        if: always()
        run: df -h "$RUNNER_TEMP"
