name: research-tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: research-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'text-fabric==13.1.0'
      - name: Run repository unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

# Historical issue-1/issue-2 corpus inventory and semantic-audit workflows were
# research tools, not converter release gates. Keep their scripts and evidence
# in-repo, but do not recertify upstream Coptic Scriptorium on every PR.
