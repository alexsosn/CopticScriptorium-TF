name: issue91-native-SBL-annotations

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: issue91-native-SBL-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-sbl:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source-code revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'
      - name: Run source/graph/native TF regressions
        run: python -m unittest discover -s tests -p 'test_issue91_*.py' -v
      - name: Checkout pinned Mark TT evidence (no redistribution)
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sahidica.mark/sahidica.mark_TT/Mark_02.tt
            /sahidica.mark/sahidica.mark_TT/Mark_16.tt
          persist-credentials: false
      - name: Verify pinned TT source revision and fixture paths
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"
          test -f upstream/sahidica.mark/sahidica.mark_TT/Mark_02.tt
          test -f upstream/sahidica.mark/sahidica.mark_TT/Mark_16.tt
      - name: Preserve and clean-reload both real Greek-annotated Mark chapters
        run: python research/issue-91/live_sbl_annotations.py upstream --output "$RUNNER_TEMP/issue91-mark-tf"

  source-census:
    needs: native-sbl
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout exact pinned TT corpus (directories and ZIP packages)
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: upstream
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*_TT/**
            /*/*_TT.zip
      - name: Verify exact upstream SHA
        run: test "$(git -C upstream rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"
      - name: Count and preserve all 2628 physical source TT records
        run: python research/issue-91/sbl_source_census.py upstream --output "$RUNNER_TEMP/sbl-source-census.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbl-annotations-pinned-source-census
          path: ${{ runner.temp }}/sbl-source-census.json
          if-no-files-found: ignore

  full-native-release-gate:
    # Heavy full-corpus rebuild is intentionally scoped to this release-gate PR
    # and manual dispatch, not every unrelated repository PR.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'validate/issue91-full-native-reload'
    needs: source-census
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact tested feature-code revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'
      - name: Checkout complete pinned Coptic TT corpus
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: upstream
          persist-credentials: false
      - name: Require exact immutable source SHA
        run: test "$(git -C upstream rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"
      - name: Run existing full converter and clean native TF reload
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/issue91-full-memory.txt" \
            python research/issue-16/full_converter_smoke.py upstream \
              --work-root "$RUNNER_TEMP/issue91-full-tf" \
              --output "$RUNNER_TEMP/issue91-complete-converter.json"
      - name: Independently verify every source SBL occurrence in full native TF
        run: |
          python research/issue-91/full_native_recheck.py upstream \
            --tf-dir "$RUNNER_TEMP/issue91-full-tf/tf" \
            --output "$RUNNER_TEMP/issue91-full-sbl-parity.json"
      - name: Report operational resources and source-free counts
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/issue91-full-memory.txt" || cat "$RUNNER_TEMP/issue91-full-memory.txt"
          test ! -f "$RUNNER_TEMP/issue91-complete-converter.json" || cat "$RUNNER_TEMP/issue91-complete-converter.json"
          test ! -f "$RUNNER_TEMP/issue91-full-sbl-parity.json" || cat "$RUNNER_TEMP/issue91-full-sbl-parity.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue91-full-SBL-native-TF-evidence
          path: |
            ${{ runner.temp }}/issue91-full-memory.txt
            ${{ runner.temp }}/issue91-complete-converter.json
            ${{ runner.temp }}/issue91-full-sbl-parity.json
          if-no-files-found: warn
          retention-days: 14
