name: issue3-research

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: issue3-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 3ac067f1709a0012daf39ea8da2fac79980176a5

jobs:
  graph-shape-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused issue 3 tests
        run: python -m unittest tests.test_issue3_graph_shape_audit -v
      - name: Check out pinned TT sources
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*_TT/**
            /*/*_TT.zip
      - name: Verify pinned upstream source
        working-directory: upstream
        run: test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Build corpus-wide graph-shape census
        run: >-
          python research/issue-3/graph_shape_audit.py upstream
          --output research/issue-3/graph-shape-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue3-graph-shape-audit
          path: research/issue-3/graph-shape-audit.json
          if-no-files-found: error
          retention-days: 14
