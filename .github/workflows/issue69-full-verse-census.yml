name: issue69-complete-pinned-verse-census

on:
  pull_request:
    paths:
      - '.github/workflows/issue69-full-verse-census.yml'
      - 'tests/live_issue69_full_verse_census.py'
      - 'tests/live_issue110_wrapper_census.py'
      - 'tests/live_issue110_full_native.py'
      - 'tests/live_issue109_profile_gate.py'
      - 'tests/test_issue109_memory_phases.py'
      - 'copticscriptorium_tf/converter.py'
      - 'research/issue-16/full_converter_smoke.py'
      - 'tests/live_issue135_full_native.py'
      - 'tests/live_issue140_full_native.py'
      - 'tests/live_issue140_source_examples.py'
      - 'tests/test_issue140_edition_annotations.py'
      - 'tests/live_issue135_source_examples.py'
      - 'tests/test_issue135_token_wrappers.py'
      - 'copticscriptorium_tf/_graph_core.py'
      - 'copticscriptorium_tf/parser.py'
      - 'copticscriptorium_tf/model.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pinned-complete-tt-source-marker-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Coptic converter PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source code head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out all and only pinned upstream TT files using sparse Git
        uses: actions/checkout@v4
        timeout-minutes: 30
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: pinned-coptic
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*_TT/**
            /*/*_TT.zip

      - name: Assert exact upstream revision before corpus audit
        run: test "$(git -C pinned-coptic rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit every raw TT record, including ZIP members, for marker position and parser compatibility
        timeout-minutes: 13
        run: |
          /usr/bin/time -v python tests/live_issue69_full_verse_census.py pinned-coptic

      - name: Reuse pinned full-source checkout to inventory unmodeled scholarly TT wrappers
        timeout-minutes: 10
        run: python tests/live_issue110_wrapper_census.py pinned-coptic

      - name: Check source token/morph events independently on pinned AP and Proclus TT
        run: PYTHONPATH=. python tests/live_issue135_source_examples.py pinned-coptic

      - name: Independently audit edition layout sample sources before TF install
        run: PYTHONPATH=. python tests/live_issue140_source_examples.py pinned-coptic

      - name: Install pinned Text-Fabric for native conversion and reload
        run: python -m pip install 'text-fabric==13.1.0'

      - name: Full pinned source native TF schema/reload release regression
        timeout-minutes: 16
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/issue110-full-time.txt" \
            python research/issue-16/full_converter_smoke.py pinned-coptic \
              --work-root "$RUNNER_TEMP/issue110-full-native" \
              --output "$RUNNER_TEMP/issue110-full-report.json" \
              --profile-memory
          python tests/live_issue110_full_native.py "$RUNNER_TEMP/issue110-full-native/tf"
          python tests/live_issue135_full_native.py "$RUNNER_TEMP/issue110-full-native/tf"
          python tests/live_issue140_full_native.py "$RUNNER_TEMP/issue110-full-native/tf"
          python tests/live_issue109_profile_gate.py "$RUNNER_TEMP/issue110-full-report.json"

      - name: Report full-source operational resource diagnostics
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/issue110-full-time.txt" || cat "$RUNNER_TEMP/issue110-full-time.txt"
          test ! -f "$RUNNER_TEMP/issue110-full-report.json" || cat "$RUNNER_TEMP/issue110-full-report.json"
          df -h "$RUNNER_TEMP"

