name: issue69-complete-pinned-verse-census

on:
  pull_request:
    paths:
      - '.github/workflows/issue69-full-verse-census.yml'
      - 'tests/live_issue69_full_verse_census.py'
      - 'tests/live_issue110_wrapper_census.py'
      - 'tests/live_issue110_full_native.py'
      - 'tests/live_issue109_profile_gate.py'
      - 'tests/test_issue109_memory_phases.py'
      - 'copticscriptorium_tf/converter.py'
      - 'research/issue-16/full_converter_smoke.py'
      - 'tests/live_issue135_full_native.py'
      - 'tests/live_issue140_full_native.py'
      - 'tests/live_issue143_full_native.py'
      - 'tests/live_issue146_full_native.py'
      - 'tests/live_issue153_full_native.py'
      - 'tests/live_issue156_full_native.py'
      - 'tests/live_issue159_full_native.py'
      - 'tests/live_issue162_full_native.py'
      - 'tests/live_issue166_full_native.py'
      - 'tests/live_issue172_full_native.py'
      - 'tests/live_issue173_full_native.py'
      - 'tests/live_issue173_source_examples.py'
      - 'tests/live_issue184_arabic_source_parity.py'
      - 'tests/live_issue187_entity_source_parity.py'
      - 'tests/live_issue189_morph_lang_parity.py'
      - 'tests/test_issue189_original_morph_lang.py'
      - 'tests/test_issue187_original_entity_text.py'
      - 'tests/test_issue184_arabic_source_tags.py'
      - 'tests/test_issue173_horner_witness.py'
      - 'tests/test_issue173_original_source_parity.py'
      - 'tests/live_issue172_source_examples.py'
      - 'tests/test_issue172_residual_source.py'
      - 'tests/test_issue172_original_source_parity.py'
      - 'tests/live_issue166_source_examples.py'
      - 'tests/test_issue166_alternate_reference.py'
      - 'tests/test_issue166_original_source_parity.py'
      - 'tests/live_issue162_source_examples.py'
      - 'tests/test_issue162_document_source_markers.py'
      - 'tests/test_issue162_original_source_parity.py'
      - 'tests/live_issue159_source_samples.py'
      - 'tests/test_issue159_entity_source_labels.py'
      - 'tests/test_issue159_original_source_parity.py'
      - 'tests/live_issue156_source_examples.py'
      - 'tests/test_issue156_multiattribute.py'
      - 'tests/test_issue156_original_attribute_parity.py'
      - 'tests/live_issue153_source_examples.py'
      - 'tests/test_issue153_editorial_wrappers.py'
      - 'tests/test_issue153_original_parity.py'
      - 'tests/live_issue146_source_examples.py'
      - 'tests/test_issue146_reference_wrappers.py'
      - 'tests/test_issue146_original_parity.py'
      - 'tests/test_issue146_runner_import.py'
      - 'tests/live_issue143_source_examples.py'
      - 'tests/test_issue143_multiword.py'
      - 'tests/test_issue143_value_parity.py'
      - 'tests/test_issue143_source_boundaries.py'
      - 'tests/test_issue143_runner_import.py'
      - 'tests/live_issue140_source_examples.py'
      - 'tests/test_issue140_edition_annotations.py'
      - 'tests/test_issue140_value_parity.py'
      - 'tests/live_issue135_source_examples.py'
      - 'tests/test_issue135_token_wrappers.py'
      - 'copticscriptorium_tf/_graph_core.py'
      - 'copticscriptorium_tf/parser.py'
      - 'copticscriptorium_tf/model.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pinned-complete-tt-source-marker-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Coptic converter PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source code head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out all and only pinned upstream TT files using sparse Git
        uses: actions/checkout@v4
        timeout-minutes: 30
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: pinned-coptic
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*_TT/**
            /*/*_TT.zip

      - name: Assert exact upstream revision before corpus audit
        run: test "$(git -C pinned-coptic rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit every raw TT record, including ZIP members, for marker position and parser compatibility
        timeout-minutes: 13
        run: |
          /usr/bin/time -v python tests/live_issue69_full_verse_census.py pinned-coptic

      - name: Reuse pinned full-source checkout to inventory unmodeled scholarly TT wrappers
        timeout-minutes: 10
        run: python tests/live_issue110_wrapper_census.py pinned-coptic

      - name: Check source token/morph events independently on pinned AP and Proclus TT
        run: PYTHONPATH=. python tests/live_issue135_source_examples.py pinned-coptic

      - name: Independently audit edition layout sample sources before TF install
        run: PYTHONPATH=. python tests/live_issue140_source_examples.py pinned-coptic

      - name: Check raw TT multiword source sample parity before TF install
        run: PYTHONPATH=. python tests/live_issue143_source_examples.py pinned-coptic

      - name: Check original chapter and Marcion/Petermann source examples
        run: PYTHONPATH=. python tests/live_issue146_source_examples.py pinned-coptic

      - name: Check original editorial source samples before native TF install
        run: PYTHONPATH=. python tests/live_issue153_source_examples.py pinned-coptic

      - name: Independently sample gap/supplied and OT abbr ZIP source evidence
        run: PYTHONPATH=. python tests/live_issue156_source_examples.py pinned-coptic

      - name: Audit original entity/name TT source examples
        run: PYTHONPATH=. python tests/live_issue159_source_samples.py pinned-coptic

      - name: Check raw original document marker source witnesses
        run: PYTHONPATH=. python tests/live_issue162_source_examples.py pinned-coptic

      - name: Check original alternative biblical and CTS TT source samples
        run: PYTHONPATH=. python tests/live_issue166_source_examples.py pinned-coptic

      - name: Inspect pinned original residual editorial and translation source witnesses
        run: PYTHONPATH=. python tests/live_issue172_source_examples.py pinned-coptic

      - name: Audit real original Pistis Sophia Horner/translation witnesses
        run: PYTHONPATH=. python tests/live_issue173_source_examples.py pinned-coptic

      - name: Independently scan both original AP Arabic tag spellings and parsed values
        run: PYTHONPATH=. python tests/live_issue184_arabic_source_parity.py pinned-coptic

      - name: Independently compare pinned original entity.text attributes with parser
        run: PYTHONPATH=. python tests/live_issue187_entity_source_parity.py pinned-coptic

      - name: Independently compare all 284 original morph.lang source literals
        run: PYTHONPATH=. python tests/live_issue189_morph_lang_parity.py pinned-coptic

      - name: Install pinned Text-Fabric for native conversion and reload
        run: python -m pip install 'text-fabric==13.1.0'

      - name: Full pinned source native TF schema/reload release regression
        timeout-minutes: 16
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/issue110-full-time.txt" \
            python research/issue-16/full_converter_smoke.py pinned-coptic \
              --work-root "$RUNNER_TEMP/issue110-full-native" \
              --output "$RUNNER_TEMP/issue110-full-report.json" \
              --profile-memory
          python tests/live_issue110_full_native.py "$RUNNER_TEMP/issue110-full-native/tf"
          python tests/live_issue135_full_native.py "$RUNNER_TEMP/issue110-full-native/tf"
          python tests/live_issue140_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue143_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue146_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue153_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue156_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue159_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue162_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue166_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue172_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          python tests/live_issue173_full_native.py "$RUNNER_TEMP/issue110-full-native/tf" pinned-coptic
          PYTHONPATH=. python tests/live_issue187_entity_source_parity.py pinned-coptic --native "$RUNNER_TEMP/issue110-full-native/tf"
          PYTHONPATH=. python tests/live_issue189_morph_lang_parity.py pinned-coptic --native "$RUNNER_TEMP/issue110-full-native/tf"
          PYTHONPATH=. python tests/live_issue184_arabic_source_parity.py pinned-coptic --native "$RUNNER_TEMP/issue110-full-native/tf"
          python tests/live_issue109_profile_gate.py "$RUNNER_TEMP/issue110-full-report.json"

      - name: Report full-source operational resource diagnostics
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/issue110-full-time.txt" || cat "$RUNNER_TEMP/issue110-full-time.txt"
          test ! -f "$RUNNER_TEMP/issue110-full-report.json" || cat "$RUNNER_TEMP/issue110-full-report.json"
          df -h "$RUNNER_TEMP"

