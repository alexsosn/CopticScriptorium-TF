name: issue69-pinned-coptic-biblical-verses

on:
  pull_request:
    paths:
      - '.github/workflows/issue69-pinned-verses.yml'
      - 'copticscriptorium_tf/model.py'
      - 'copticscriptorium_tf/parser.py'
      - 'copticscriptorium_tf/_graph_core.py'
      - 'copticscriptorium_tf/writer.py'
      - 'tests/live_issue69_pinned_verses.py'
      - 'tests/test_issue69_native_verse_references.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue69-pinned-verses.yml'
      - 'copticscriptorium_tf/model.py'
      - 'copticscriptorium_tf/parser.py'
      - 'copticscriptorium_tf/_graph_core.py'
      - 'copticscriptorium_tf/writer.py'
      - 'tests/live_issue69_pinned_verses.py'

permissions:
  contents: read

jobs:
  pinned-verse-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Coptic converter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify reviewed converter head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out three real pinned biblical TT documents only
        uses: actions/checkout@v4
        with:
          repository: CopticScriptorium/corpora
          ref: 3ac067f1709a0012daf39ea8da2fac79980176a5
          path: real-coptic
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sahidic.ruth/sahidic.ruth_TT/Ruth_02.tt
            /sahidic.jonah/sahidic.jonah_TT/Jonah_02.tt
            /bohairic-habakkuk/bohairic.habakkuk_TT/bohairic.Habakkuk_02.tt

      - name: Assert pinned exact upstream commit
        run: test "$(git -C real-coptic rev-parse HEAD)" = "3ac067f1709a0012daf39ea8da2fac79980176a5"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Text-Fabric
        run: python -m pip install 'text-fabric==13.1.0'

      - name: RED/green source-faithful marker tests
        run: python -m unittest tests.test_issue69_native_verse_references -v

      - name: Convert genuine Ruth, Jonah, and Habakkuk TT to native TF and reload
        run: python tests/live_issue69_pinned_verses.py real-coptic
